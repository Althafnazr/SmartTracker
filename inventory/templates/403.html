<!DOCTYPE html>
<html>
<head>
  <title>403 — Access Denied | Smart Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #4f8ef7;
      --accent2: #34d399;
      --accent4: #f87171;
      --text: #e8eaf0;
      --muted: #6b7280;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.2;
      z-index: 0;
      pointer-events: none;
    }

    /* Red glow blob */
    .blob {
      position: fixed;
      width: 600px; height: 600px;
      background: var(--accent4);
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.07;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: pulse 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulse {
      from { opacity: 0.05; transform: translate(-50%, -50%) scale(1); }
      to   { opacity: 0.1;  transform: translate(-50%, -50%) scale(1.1); }
    }

    .error-wrapper {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px;
      animation: fadeUp 0.5s ease both;
      max-width: 500px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Big error code */
    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 7rem;
      font-weight: 600;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent4), #ff9a6c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.04em;
    }

    .error-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 16px;
      animation: shake 0.6s ease 0.3s both;
    }

    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      20%       { transform: rotate(-10deg); }
      40%       { transform: rotate(10deg); }
      60%       { transform: rotate(-6deg); }
      80%       { transform: rotate(6deg); }
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    .error-msg {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .error-msg strong {
      color: var(--accent4);
    }

    /* Card */
    .error-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px 36px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      margin-bottom: 24px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    /* Status row */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent4);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--accent);
      color: #fff !important;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 10px;
      text-decoration: none !important;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 14px rgba(79,142,247,0.3);
    }

    .btn-home:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      color: var(--muted) !important;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      text-decoration: none !important;
      transition: all 0.2s;
    }

    .btn-back:hover {
      color: var(--text) !important;
      border-color: var(--muted);
    }

    .footer-note {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .footer-note a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="blob"></div>

  <div class="error-wrapper">
    <div class="error-card">

      <span class="error-icon">🔒</span>
      <div class="error-code">403</div>
      <h1 class="error-title">Access Denied</h1>
      <p class="error-msg">
        You don't have permission to view this page.<br>
        Contact your <strong>Admin</strong> to request access.
      </p>

      <div class="status-row">
        <div class="status-dot"></div>
        <span>HTTP 403 · FORBIDDEN · SMARTTRACKER</span>
      </div>

      <div class="divider"></div>

      <div class="btn-row">
        <a href="/dashboard/" class="btn-home">🏠 Go to Dashboard</a>
        <a href="javascript:history.back()" class="btn-back">← Go Back</a>
      </div>

    </div>
  </div>

</body>
</html>
