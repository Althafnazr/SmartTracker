<!DOCTYPE html>
<html>
<head>
  <title>Smart Tracker — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #4f8ef7;
      --accent2: #34d399;
      --accent4: #f87171;
      --text: #e8eaf0;
      --muted: #6b7280;
      --radius: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background blobs */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.12;
      animation: drift 10s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    .blob-1 {
      width: 520px; height: 520px;
      background: var(--accent);
      top: -160px; left: -160px;
      animation-delay: 0s;
    }

    .blob-2 {
      width: 400px; height: 400px;
      background: var(--accent2);
      bottom: -120px; right: -100px;
      animation-delay: 3s;
    }

    .blob-3 {
      width: 260px; height: 260px;
      background: #a855f7;
      top: 50%; left: 60%;
      animation-delay: 6s;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.06); }
    }

    /* Grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.25;
      z-index: 0;
      pointer-events: none;
    }

    /* Login card */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Brand */
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      margin: 0 auto 14px;
      box-shadow: 0 8px 24px rgba(79,142,247,0.3);
    }

    .brand h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* Card */
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
    }

    .login-card h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .login-card .subtitle {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* Form fields — style Django's form.as_p */
    .login-card p {
      margin-bottom: 18px;
    }

    .login-card label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .login-card input[type="text"],
    .login-card input[type="password"],
    .login-card input[type="email"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.92rem;
      padding: 11px 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }

    .login-card input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,142,247,0.14);
    }

    /* Error messages */
    .login-card ul.errorlist {
      list-style: none;
      padding: 0;
      margin: 6px 0 0;
    }

    .login-card ul.errorlist li {
      font-size: 0.78rem;
      color: var(--accent4);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .login-card ul.errorlist li::before { content: '⚠ '; }

    /* Non-field errors */
    .login-card .non-field-errors {
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: var(--accent4);
      margin-bottom: 18px;
    }

    /* Login button */
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #3b7de8);
      border: none;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(79,142,247,0.3);
      margin-top: 8px;
    }

    .btn-login:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(79,142,247,0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    /* Footer note */
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .login-footer span {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- Background blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="login-wrapper">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <h1>Smart Tracker</h1>
      <p>Electronic Inventory & Service Management</p>
    </div>

    <!-- Card -->
    <div class="login-card">
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to your account to continue</p>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-login">Sign In →</button>
      </form>
    </div>


  </div>

</body>
</html>
